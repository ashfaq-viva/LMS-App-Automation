appId: com.lms.app.dev
name: TC-57 Edit and restore Phone Number
tags: [profile, edit-profile, regression]
---
- runFlow: components/open-edit-profile.yaml
- runFlow: components/scroll-to-profile-bottom.yaml
- copyTextFrom:
    text: "[0-9]{6,}"
    below:
      text: "Phone number \\*"
- evalScript: ${output.originalPhone = maestro.copiedText}
- tapOn:
    text: "[0-9]{6,}"
    below:
      text: "Phone number \\*"
- eraseText
- inputText: "1621893332"
- tapOn:
    text: "Save"
    index: 0
- assertVisible: "1621893332"
- tapOn: "1621893332"
- eraseText
- inputText: ${output.originalPhone}
- tapOn:
    text: "Save"
    index: 0
- assertVisible: ${output.originalPhone}
