appId: com.lms.app.dev
name: TC-46 Save profile changes with the bottom Save button
tags: [profile, edit-profile, regression]
---
- runFlow: components/open-edit-profile.yaml
- runFlow: components/scroll-to-profile-bottom.yaml
- copyTextFrom:
    below:
      text: "Gender \\*"
- evalScript: ${output.originalValue = maestro.copiedText}
- evalScript: "${output.temporaryValue = output.originalValue === 'Male' ? 'Female' : 'Male'}"
- tapOn: ${output.originalValue}
- tapOn: ${output.temporaryValue}
- tapOn:
    text: "Save"
    index: 1
- extendedWaitUntil:
    visible: ${output.temporaryValue}
    timeout: 10000
- tapOn: ${output.temporaryValue}
- tapOn: ${output.originalValue}
- tapOn:
    text: "Save"
    index: 1
- assertVisible: ${output.originalValue}
