appId: com.lms.app.dev
name: TC-62 Validate password errors and controls
tags: [profile, update-password, validation]
---
- runFlow: ../components/open-update-password.yaml
- tapOn: "Enter current password"
- inputText: "Incorrect123!"
- tapOn: "New password"
- inputText: "Abcd123!"
- tapOn: "Confirm password"
- inputText: "Abcd123!"
- tapOn: "done|Done"
- tapOn: "Save Changes"
- extendedWaitUntil:
    visible: "Current password is not correct."
    timeout: 15000
- tapOn:
    below:
      text: "Confirm New Password \\*"
- eraseText
- inputText: "Abcd124!"
- assertVisible: "Passwords do not match"
- tapOn: "done|Done"
- assertVisible: "8 or more characters"
- assertVisible: "At least one uppercase letter \\(e.g. ABC\\)"
- assertVisible: "At least one lowercase letter \\(e.g. abc\\)"
- assertVisible: "At least one number \\(e.g. 123\\)"
- assertVisible: "At least one symbol \\(e.g. @#\\)"
