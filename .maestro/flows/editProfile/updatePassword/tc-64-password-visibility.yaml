appId: com.lms.app.dev
name: TC-64 Toggle password visibility
tags: [profile, update-password, regression]
---
- runFlow: ../components/open-update-password.yaml
- tapOn: "Enter current password"
- inputText: "Visibility123!"
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- assertVisible: "Visibility123!"
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- assertNotVisible: "Visibility123!"
- tapOn: "New password"
- inputText: "NewVisibility123!"
- tapOn:
    id: "password_visibility_toggle"
    index: 1
- assertVisible: "NewVisibility123!"
- tapOn: "Confirm password"
- inputText: "ConfirmVisibility123!"
- tapOn:
    id: "password_visibility_toggle"
    index: 2
- assertVisible: "ConfirmVisibility123!"
