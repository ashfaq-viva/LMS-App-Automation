appId: com.lms.app.dev
name: TC-44 Reject joining an existing team membership by the user who created the team
tags: [team, join-team, regression]
---
- runFlow: ../components/successful-login.yaml
- runFlow: ../components/open-join-team.yaml
- runFlow:
    file: ../components/find-team.yaml
    env:
      TEAM_NAME: "${TEAM_NAME}"
      TEAM_CODE: "${TEAM_CODE}"
- tapOn: "Confirm & Join Team"
- assertVisible: ".*(already|member).*"
