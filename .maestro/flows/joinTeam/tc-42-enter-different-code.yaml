appId: com.lms.app.dev
name: TC-42 Enter a different team code
tags: [team, join-team, regression]
---
- runFlow: ../components/successful-login.yaml
- runFlow: ../components/open-join-team.yaml
- runFlow:
    file: ../components/find-team.yaml
    env:
      TEAM_NAME: "${TEAM_NAME}"
      TEAM_CODE: "${TEAM_CODE}"
- tapOn: "Enter a different code\nEnter a different code"
- assertVisible: "Join a Team"
