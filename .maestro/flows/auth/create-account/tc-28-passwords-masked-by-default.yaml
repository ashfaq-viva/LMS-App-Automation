appId: com.lms.app.dev
name: TC-28 Create account passwords masked by default
tags: [auth, create-account, regression]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- tapOn:
    text: "Password"
    index: 0
- inputText: "Test@123"
- scrollUntilVisible:
    element:
      text: "Re-type Password \\*"
    direction: DOWN
- tapOn: "Password"
- inputText: "Test@123"
- hideKeyboard
- assertVisible:
    text: "\\*\\*\\*\\*\\*\\*\\*\\*"
    index: 0
- assertVisible:
    text: "\\*\\*\\*\\*\\*\\*\\*\\*"
    index: 1
- assertNotVisible: "Test@123"
