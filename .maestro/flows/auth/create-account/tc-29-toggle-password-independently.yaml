appId: com.lms.app.dev
name: TC-29 Toggle create account password independently
tags: [auth, create-account, regression]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- tapOn:
    text: "Password"
    index: 0
- inputText: "Primary@123"
- scrollUntilVisible:
    element:
      text: "Re-type Password \\*"
    direction: DOWN
- tapOn: "Password"
- inputText: "Confirm@12"
- hideKeyboard
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- assertVisible: "Primary@123"
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertNotVisible: "Confirm@12"
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertNotVisible: "Primary@123"
