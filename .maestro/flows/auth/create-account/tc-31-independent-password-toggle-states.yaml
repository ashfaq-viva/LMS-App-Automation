appId: com.lms.app.dev
name: TC-31 Create account password toggles maintain independent states
tags: [auth, create-account, regression]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- tapOn:
    text: "Password"
    index: 0
- inputText:
    text: "Primary@123"
    label: Enter password
- scrollUntilVisible:
    element:
      text: "Re-type Password \\*"
    direction: DOWN
- tapOn: "Password"
- inputText:
    text: "Confirm@12"
    label: Enter password confirmation
- hideKeyboard
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- tapOn:
    id: "password_visibility_toggle"
    index: 1
- assertVisible: "Primary@123"
- assertVisible: "Confirm@12"
- tapOn:
    id: "password_visibility_toggle"
    index: 0
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertVisible: "Confirm@12"
- assertNotVisible: "Primary@123"
- tapOn:
    id: "password_visibility_toggle"
    index: 1
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertVisible: "\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*"
- assertNotVisible: "Confirm@12"
