appId: com.lms.app.dev
name: TC-22 Create account password requirement progress
tags: [auth, create-account, validation]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- tapOn: "First Name"
- inputText: "Rajib"
- tapOn: "Last Name"
- inputText: "Khan"
- tapOn: "name@gmail.com"
- inputText: "test97@gmail.com"
- tapOn:
    text: "Password"
    index: 0
- inputText: "r"
- assertVisible: "Password must contain :"
- inputText: "A"
- inputText: "1"
- inputText: "@"
- inputText: "2345"
- scrollUntilVisible:
    element:
      text: "Re-type Password \\*"
    direction: DOWN
- tapOn: "Password"
- inputText: "rA1@2345"
- scrollUntilVisible:
    element:
      text: "Create Account"
      enabled: true
    direction: DOWN
- assertVisible:
    text: "Create Account"
    enabled: true
