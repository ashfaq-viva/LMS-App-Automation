appId: com.lms.app.dev
name: TC-21 Create account password mismatch
tags: [auth, create-account, validation]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- runFlow:
    file: ../../components/fill-create-account.yaml
    env:
      FIRST_NAME: "Rajib"
      LAST_NAME: "Khan"
      EMAIL: "test97@gmail.com"
      PASSWORD: "Rajib@12"
      CONFIRM_PASSWORD: "Different@12"
- assertVisible: "Passwords do not match"
- scrollUntilVisible:
    element:
      text: "Create Account"
      enabled: false
    direction: DOWN
- assertVisible:
    text: "Create Account"
    enabled: false
