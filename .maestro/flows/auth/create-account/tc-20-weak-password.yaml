appId: com.lms.app.dev
name: TC-20 Create account weak password
tags: [auth, create-account, validation]
---
- runFlow: ../../components/launch-login.yaml
- runFlow: ../../components/open-create-account.yaml
- runFlow:
    file: ../../components/fill-create-account.yaml
    env:
      FIRST_NAME: "Rajib"
      LAST_NAME: "Khan"
      EMAIL: "test97@gmail.com"
      PASSWORD: "weak"
      CONFIRM_PASSWORD: "weak"
- scrollUntilVisible:
    element:
      text: "Password must contain :"
    direction: UP
- scrollUntilVisible:
    element:
      text: "8 or more characters"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "At least one uppercase letter.*"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "At least one number.*"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "At least one symbol.*"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Create Account"
      enabled: false
    direction: DOWN
- assertVisible:
    text: "Create Account"
    enabled: false
