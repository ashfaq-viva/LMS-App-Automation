appId: com.lms.app.dev
name: TC-03 Registered email with wrong password
tags: [auth, regression]
---
- runFlow: ../../components/launch-login.yaml
- runFlow:
    file: ../../components/submit-login.yaml
    env:
      EMAIL: "${VALID_EMAIL}"
      PASSWORD: "12345"
- assertVisible: "Incorrect password"
- assertVisible: "The password you entered is incorrect. Please try again or "
