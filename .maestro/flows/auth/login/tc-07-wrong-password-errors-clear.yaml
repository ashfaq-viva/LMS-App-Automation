appId: com.lms.app.dev
name: TC-07 Wrong password errors clear on field change
tags: [auth, login, regression]
---
- runFlow: ../../components/launch-login.yaml
- runFlow:
    file: ../../components/submit-login.yaml
    env:
      EMAIL: "${VALID_EMAIL}"
      PASSWORD: "12345"
- assertVisible: "Incorrect password"
- assertVisible: "The password you entered is incorrect. Please try again or "
- tapOn: "\\*\\*\\*\\*\\*"
- eraseText: 1
- assertNotVisible: "Incorrect password"
- assertNotVisible: "The password you entered is incorrect. Please try again or "
- assertVisible: "${VALID_EMAIL}"
