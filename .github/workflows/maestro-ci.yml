name: CI/CD

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing app-development-debug.apk (leave empty for latest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  maestro-tests:
    name: Maestro authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages_artifact: ${{ steps.pages_upload.outcome }}
    env:
      APK_NAME: app-development-debug.apk
      MAESTRO_VERSION: 2.6.1
      REPORT_RECIPIENT: ashfaq.ahmed@vivasoftltd.com
      VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [[ -z "$VALID_EMAIL" || -z "$VALID_PASSWORD" || -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" ]]; then
            printf 'VALID_EMAIL, VALID_PASSWORD, SMTP_USERNAME, and SMTP_PASSWORD repository secrets are required.\n' >&2
            exit 1
          fi

      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p apps
          if [[ -n "$RELEASE_TAG" ]]; then
            gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir apps --clobber
          else
            gh release download --pattern "$APK_NAME" --dir apps --clobber
          fi
          test -s "apps/$APK_NAME"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Maestro and Allure
        id: install_tools
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          npm install --global allure@3.14.3
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
          allure --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "apps/$APK_NAME"
            .maestro/scripts/run-auth-tests.sh

      - name: Generate Allure report
        id: report
        if: ${{ always() && steps.install_tools.outcome == 'success' }}
        run: |
          mkdir -p artifacts/allure-results
          allure generate artifacts/allure-results

      - name: Upload Allure report for GitHub Pages
        id: pages_upload
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/allure-report

      - name: Add test summary
        id: summary
        if: ${{ always() && steps.report.outcome == 'success' }}
        run: |
          node .maestro/scripts/allure-results.js summary artifacts/allure-results "$GITHUB_STEP_SUMMARY"
          node .maestro/scripts/allure-results.js summary artifacts/allure-results summary.txt

      - name: Redact credentials from artifacts
        if: always()
        run: node .maestro/scripts/allure-results.js sanitize artifacts

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-${{ github.run_number }}
          path: |
            artifacts/allure-report/
            artifacts/allure-results/
            artifacts/junit/
            artifacts/logs/
            artifacts/maestro/
          if-no-files-found: warn
          retention-days: 7

      - name: Send email summary
        if: ${{ always() && steps.summary.outcome == 'success' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Maestro report - ${{ github.repository }} - ${{ job.status }}
          to: ${{ env.REPORT_RECIPIENT }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: file://summary.txt

  deploy-report:
    name: Deploy Allure report to GitHub Pages
    needs: maestro-tests
    if: ${{ always() && needs.maestro-tests.outputs.pages_artifact == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
